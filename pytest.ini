[pytest]
testpaths = app/tests
python_files = test_*.py

# Keep the default run fast. The agent sweep trains 19 reinforcement-learning
# policies and the UI tests boot Streamlit headlessly; both are minutes rather
# than seconds, so they only run with --runslow.
markers =
    slow: trains a model or boots the app (run with --runslow)

# The ported notebooks run on tf.compat.v1 by design — TF 2.15 is the newest
# release with a complete v1 surface. Its "use tf.keras instead" warnings are
# expected and unactionable without rewriting every agent, so they are silenced
# rather than left to bury real output.
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore:.*tf\.layers\.dense.*:UserWarning
    ignore:.*tf\.nn\.rnn_cell.*:UserWarning
    ignore:.*tf\.nn\.dynamic_rnn.*:UserWarning
    ignore:.*is deprecated and will be removed in a future version.*:UserWarning
